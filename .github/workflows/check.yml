name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          for f in lib/*.js work/*.mjs tools/*.mjs; do node --check "$f"; done
      - name: Self check (modules + catalog)
        run: node tools/self-check.mjs
