<div id="hud">
  <b>定义逻辑图 · 1.0 雏形</b>
  <span id="counter">01 / 24</span>
  <div id="dots"><i data-i="0" class="on"></i><i data-i="1" class=""></i><i data-i="2" class=""></i><i data-i="3" class=""></i><i data-i="4" class=""></i><i data-i="5" class=""></i><i data-i="6" class=""></i><i data-i="7" class=""></i><i data-i="8" class=""></i><i data-i="9" class=""></i><i data-i="10" class=""></i><i data-i="11" class=""></i><i data-i="12" class=""></i><i data-i="13" class=""></i><i data-i="14" class=""></i><i data-i="15" class=""></i><i data-i="16" class=""></i><i data-i="17" class=""></i><i data-i="18" class=""></i><i data-i="19" class=""></i><i data-i="20" class=""></i><i data-i="21" class=""></i><i data-i="22" class=""></i><i data-i="23" class=""></i></div>
  <span class="sp"></span>
  <button id="prev">上一页</button>
  <button id="next">下一页</button>
  <button id="full">全屏</button>
</div>
<script>
  const slides = [...document.querySelectorAll('.slide')];
  const dots = [...document.querySelectorAll('#dots i')];
  const counter = document.getElementById('counter');
  let cur = 0;
  const total = slides.length;
  function go(i) {
    cur = Math.max(0, Math.min(total - 1, i));
    slides.forEach((s, k) => s.classList.toggle('on', k === cur));
    dots.forEach((d, k) => d.classList.toggle('on', k === cur));
    counter.textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
    history.replaceState(null, '', '#' + (cur + 1));
  }
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    if (e.key === 'Home') go(0);
    if (e.key === 'End') go(total - 1);
    if (e.key.toLowerCase() === 'f') document.documentElement.requestFullscreen?.();
  });
  document.getElementById('next').onclick = () => go(cur + 1);
  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('full').onclick = () => document.documentElement.requestFullscreen?.();
  dots.forEach((d) => (d.onclick = () => go(+d.dataset.i)));
  slides.forEach((s, k) => (s.onclick = (e) => go(e.offsetX > s.clientWidth / 2 ? k + 1 : k - 1)));
  const fromHash = parseInt(location.hash.replace('#', ''), 10);
  if (fromHash > 0) go(fromHash - 1);
</script>
